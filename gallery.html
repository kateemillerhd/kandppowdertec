<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="View photos of mobile sandblasting projects completed by K&P Powdertec, LLC. See examples of our surface preparation and sandblasting work throughout New York.">
        <link rel="canonical" href="https://kandppowdertec.com/gallery.html">
        <link rel="stylesheet" href="./gallery.css">

        <title>Mobile Sandblasting Project Gallery | K&P Powdertec</title>
    </head>

    <body>
        <header>
            <div>
                <a href="/"><img src="./images/logo_background.png" /></a>
                <span>K&P Powdertec Mobile Sandblasting</span>
            </div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./gallery.html">Gallery</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main class="gallery-page">
            <div class="gallery-header">
                <h1>Our Work</h1>
                <p>Take a look at some of our recent projects</p>
            </div>

            <div class="gallery-grid" id="gallery-grid">

            </div>

            <div class="gallery-load-more">
                <button id="load-more-btn" type="button">Load More...</button>
            </div>

            <div 
                class="lightbox"
                id="lightbox"
                role="dialog"
                aria-modal="true"
                aria-label="Photo viewer"
                aria-hidden="true"\
            >
                <button class="lightbox-close" id="lightbox-close" aria-label="Close image">
                    &times;
                </button>

                <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">
                    &#10094;
                </button>

                <img id="lightbox-img" src="" alt="">

                <button class="lightbox-next" id="lightbox-next" aria-label="Next image">
                    &#10095;
                </button>
                <div class="lightbox-counter" id="lightbox-counter" aria-live="polite"></div>  
            </div>
        </main>
        <script src="./js/gallery.js" defer></script>
    </body>
</html>
